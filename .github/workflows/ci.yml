name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]   # Glue 4.0 runs 3.10; 3.11 to catch drift early
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
      AWS_DEFAULT_REGION: ap-south-1   # moto needs a region; no real credentials are used
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q generator ingestion transforms quality pipeline glue

      - name: Unit tests
        run: pytest -q -m "not integration" --junitxml=reports/unit.xml

      - name: Integration tests (generator -> bronze -> SCD2 -> DQ -> promote)
        run: pytest -q -m integration --junitxml=reports/integration.xml

      - name: Smoke run of the daily pipeline on generated data
        run: |
          python -m generator.cdc_events --snapshot 20 --changes 200 --duplicate-rate 0.05 --late-rate 0.05 \
            --out data/output/in/all.jsonl
          python -m pipeline.split_days data/output/in/all.jsonl data/output/in
          first=$(ls data/output/in/20*.jsonl | head -1)
          second=$(ls data/output/in/20*.jsonl | sed -n 2p)
          python -m pipeline.daily_run --input "$first" --run-id day1
          python -m pipeline.daily_run --input "$second" --run-id day2 --start-offset $(wc -l < "$first")
          test "$(cat data/output/silver/dim_customer_scd2/_CURRENT)" = "v=day2"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python }}
          path: |
            reports/
            data/output/silver/**/_dq/*.json
          if-no-files-found: ignore

  glue-package:
    name: Glue code package
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: ./scripts/package_glue.sh
      - name: Check the zip has only the job packages
        run: |
          python - <<'PY'
          import zipfile
          names = zipfile.ZipFile("dist/cdc_pipeline.zip").namelist()
          tops = {n.split("/")[0] for n in names}
          assert tops == {"ingestion", "transforms", "quality", "pipeline"}, tops
          assert not any("test" in n for n in names), names
          print(len(names), "files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cdc_pipeline-zip
          path: dist/cdc_pipeline.zip

  terraform:
    name: terraform fmt / validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Build the Glue zip (s3.tf hashes it)
        working-directory: .
        run: ./scripts/package_glue.sh
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
